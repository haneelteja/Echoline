services:
  - type: web
    name: echoline-api
    runtime: node
    plan: free
    region: oregon
    # --prod=false: NODE_ENV=production (set below) makes pnpm skip devDependencies
    # by default, but esbuild/typescript/etc. are devDependencies needed to build.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @echoline/core build && pnpm --filter @echoline/db build && pnpm --filter @echoline/providers build && pnpm --filter @echoline/api build
    startCommand: pnpm --filter @echoline/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: SENTRY_DSN
        sync: false # optional — error reporting is a no-op until this is set
      - key: CORS_ORIGINS
        sync: false # comma-separated list of allowed web origins, e.g. your Vercel domain(s)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CREDENTIAL_VAULT_MASTER_KEY
        sync: false # base64, 32 bytes. Generate with: openssl rand -base64 32
      - key: TRACKING_SIGNING_SECRET
        sync: false # signs open-pixel/click-redirect/unsubscribe URLs — must match echoline-worker's value
      - key: REDIS_URL
        sync: false # Upstash Redis connection string (redis://..., the ioredis/TCP one, not the REST URL)
      - key: API_PUBLIC_URL
        value: https://echoline-api.onrender.com
      - key: WEB_PUBLIC_URL
        value: https://echoline-omega.vercel.app
      # OAuth (Phase 2) - unset until real Google Cloud / Azure App Registration
      # credentials exist; gmail/outlook connections respond 503 until then.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_ID
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_SECRET
        sync: false

  # BullMQ scheduler (5-min repeatable tick) + send-email/send-whatsapp
  # processors. Deployed as a free Web Service (not a Background Worker,
  # which requires a paid plan) by binding a trivial health endpoint
  # (see src/healthServer.ts) — an external uptime pinger (UptimeRobot/
  # cron-job.org) must hit it more often than Render's 15-min idle
  # spin-down, or the process (and the BullMQ consumers inside it) sleeps.
  - type: web
    name: echoline-worker
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @echoline/core build && pnpm --filter @echoline/db build && pnpm --filter @echoline/providers build && pnpm --filter @echoline/worker build
    startCommand: pnpm --filter @echoline/worker start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: SENTRY_DSN
        sync: false # optional — error reporting is a no-op until this is set
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CREDENTIAL_VAULT_MASTER_KEY
        sync: false # must be the SAME value as echoline-api's
      - key: TRACKING_SIGNING_SECRET
        sync: false # must be the SAME value as echoline-api's
      - key: REDIS_URL
        sync: false # same Upstash Redis connection string as echoline-api's
      - key: API_PUBLIC_URL
        value: https://echoline-api.onrender.com
      # OAuth token refresh (Gmail/Outlook) happens here, before each send —
      # must match echoline-api's values exactly.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_ID
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_SECRET
        sync: false
